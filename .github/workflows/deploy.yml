name: Build and deploy steepstep.com

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Type PUBLISH to request the protected production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: steepstep-production
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify GitHub source commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Build source verified: $actual ($GITHUB_REF)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro project
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v7
        with:
          name: steepstep-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to All-Inkl via FTPS
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'PUBLISH'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://steepstep.com/
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify GitHub source commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Deploy source verified: $actual ($GITHUB_REF)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download verified build artifact
        uses: actions/download-artifact@v5
        with:
          name: steepstep-site-${{ github.sha }}
          path: dist

      - name: Validate deployment inputs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER" >&2; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME" >&2; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD" >&2; exit 1; }
          test -d dist || { echo "Build artifact directory is missing" >&2; exit 1; }
          test -n "$(find dist -type f -print -quit)" || { echo "Build artifact is empty" >&2; exit 1; }
          if find dist -type l -print -quit | grep -q .; then
            echo "Refusing to deploy an artifact containing symlinks" >&2
            exit 1
          fi

      # All-Inkl's endpoint needs loose certificate verification. Upload each
      # regular file into the exact target path without deleting remote files.
      - name: Upload static files over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          STEEPSTEP_FORM_SECRET: ${{ secrets.STEEPSTEP_FORM_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${STEEPSTEP_FORM_SECRET:-}" || { echo "Missing STEEPSTEP_FORM_SECRET" >&2; exit 1; }
          secret_b64="$(printf '%s' "$STEEPSTEP_FORM_SECRET" | base64 | tr -d '\n')"
          printf '%s\n' '<?php' 'declare(strict_types:1);' "return base64_decode('$secret_b64', true);" > dist/api/form-secret.php
          test -s dist/api/form-secret.php
          trap 'rm -f dist/api/form-secret.php' EXIT INT TERM
          while IFS= read -r -d '' file; do
            relative="${file#dist/}"
            case "$relative" in
              ""|/*|../*|*/../*|*'/..'|*'//'*)
                echo "Refusing unsafe artifact path: $relative" >&2
                exit 1
                ;;
            esac
            echo "Uploading $relative"
            curl --fail --silent --show-error \
              --ssl-reqd --ftp-pasv --insecure \
              --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$file" \
              "ftp://$FTP_SERVER/steepstep.com/$relative"
          done < <(find dist -type f -print0)
