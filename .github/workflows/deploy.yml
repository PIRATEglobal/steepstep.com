name: Build and deploy steepstep.com

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Type PUBLISH to request the protected production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: steepstep-production
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify GitHub source commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Build source verified: $actual ($GITHUB_REF)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro project
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: steepstep-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to All-Inkl via FTPS
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'PUBLISH'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://steepstep.com/
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify GitHub source commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Deploy source verified: $actual ($GITHUB_REF)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download verified build artifact
        uses: actions/download-artifact@v5
        with:
          name: steepstep-site-${{ github.sha }}
          path: dist

      - name: Validate deployment inputs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER" >&2; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME" >&2; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD" >&2; exit 1; }
          test -d dist || { echo "Build artifact directory is missing" >&2; exit 1; }
          test -n "$(find dist -type f -print -quit)" || { echo "Build artifact is empty" >&2; exit 1; }
          if find dist -type l -print -quit | grep -q .; then
            echo "Refusing to deploy an artifact containing symlinks" >&2
            exit 1
          fi

      # This is the tested All-Inkl transport used by the existing piratex.com
      # deployment. All-Inkl's endpoint needs loose certificate verification.
      # The limitation is recorded in docs/deployment/DEPLOYMENT.md; credentials
      # stay in the protected production environment.
      - name: Incremental FTPS deploy (attempt 1)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        continue-on-error: true
        id: deploy_attempt_1
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: /steepstep.com/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json

      - name: Wait before FTPS retry 2
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Incremental FTPS deploy (attempt 2)
        if: steps.deploy_attempt_1.outcome == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        continue-on-error: true
        id: deploy_attempt_2
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: /steepstep.com/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json

      - name: Wait before FTPS retry 3
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 60

      - name: Incremental FTPS deploy (attempt 3, final)
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: /steepstep.com/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
