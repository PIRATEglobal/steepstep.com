name: Diagnose live contact secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect generated secret over FTPS
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Inspect exact production file
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          STEEPSTEP_FORM_SECRET: ${{ secrets.STEEPSTEP_FORM_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT INT TERM
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" && test -n "$STEEPSTEP_FORM_SECRET"
          encoded="$(printf '%s' "$STEEPSTEP_FORM_SECRET" | base64 | tr -d '\n')"
          printf '%s\n' '<?php' 'declare(strict_types=1);' "return base64_decode('$encoded', true);" > "$workdir/expected.php"
          curl --fail --silent --show-error --ssl-reqd --ftp-pasv --insecure \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --output "$workdir/remote.php" \
            "ftp://$FTP_SERVER/steepstep.com/api/form-secret.php"
          test "$(wc -c < "$workdir/remote.php")" -gt 20
          php -l "$workdir/remote.php" >/dev/null
          php -r '$value = require $argv[1]; if (!is_string($value) || $value === "") exit(21);' "$workdir/remote.php"
          if cmp -s "$workdir/expected.php" "$workdir/remote.php"; then
            echo 'REMOTE_SECRET_FILE=VALID_MATCH'
          else
            echo 'REMOTE_SECRET_FILE=VALID_BUT_DIFFERENT'
          fi
